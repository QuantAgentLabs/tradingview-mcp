services:
  tradingview-mcp:
    build:
      context: .
    image: tradingview-mcp:local
    environment:
      TRADINGVIEW_CDP_HOST: ${TRADINGVIEW_CDP_HOST:-0.250.250.254}
      TRADINGVIEW_CDP_PORT: ${TRADINGVIEW_CDP_PORT:-9222}
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
    command: ["node", "src/server.js", "--transport=http"]
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  tv:
    image: tradingview-mcp:local
    build:
      context: .
    environment:
      TRADINGVIEW_CDP_HOST: ${TRADINGVIEW_CDP_HOST:-0.250.250.254}
      TRADINGVIEW_CDP_PORT: ${TRADINGVIEW_CDP_PORT:-9222}
    profiles:
      - cli
    entrypoint: ["node", "src/cli/index.js"]
    command: ["--help"]
